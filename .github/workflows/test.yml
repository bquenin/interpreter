name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-x11-capture:
    name: X11 capture
    runs-on: ubuntu-latest
    env:
      XDG_SESSION_TYPE: x11
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install PipeWire runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpipewire-0.3-0

      - name: Install uv
        run: python -m pip install uv==0.9.21

      - name: Install locked project and test dependencies
        run: uv sync --locked

      - name: Test X11 capture without a display server
        run: uv run --locked pytest -q tests/test_linux_x11.py

  windows-install-scripts:
    name: Windows install scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Test Windows install scripts
        run: python -m pytest -q tests/test_uninstall_windows.py tests/test_install_scripts_posix.py tests/test_paths.py

  posix-install-scripts:
    name: POSIX install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Test POSIX install scripts
        run: python -m pytest -q tests/test_install_scripts_posix.py tests/test_paths.py
